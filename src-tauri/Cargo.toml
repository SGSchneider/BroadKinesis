[package]
name = "broadkinesis"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "broadkinesis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
twitch-irc = "6.1.2"
tiny_http = "0.12"
url = "2"
obws = "0.15.0"
# Embedded key-value database (stores everything in a single file)
redb = "4.3.0"

# Modern authenticated encryption (ChaCha20-Poly1305)
chacha20poly1305 = { version = "0.11.0", features = ["alloc"] }

# Generate random bytes for the encryption nonce/IV
rand = "0.10.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
